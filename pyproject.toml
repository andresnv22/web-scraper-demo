[project]
name = "web-scraper-demo"
version = "0.1.0"
description = "Polite web scraper: public pages to Excel/CSV, with pagination, retries and tests"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pandas>=2.1", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
